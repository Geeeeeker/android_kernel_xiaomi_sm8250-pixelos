name: boot需要修改为pe官方提供的img！编译内核 ( LXC/Docker + USB/IP + UMI )

on:
  push:
    branches:
      - dev/*
      - stable/*
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_version:
        description: '分支'
        required: true
        default: 'sixteen-qpr2'
        type: choice
        options:
          - 'sixteen'
          - 'sixteen-qpr1'
          - 'sixteen-qpr2'

env:
  DEVICE: umi
  DEFCONFIG: stock-defconfig
  MAGISK_CANARY_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  KERNELSU_VERSION: v0.9.5
  APATCH_VERSION: 11142
  APATCH_TAG: 11142_166daa0_on_HEAD-release-signed

jobs:
  build:
    name: 编译内核 (umi)
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      # ========== 基础环境准备 ==========
      - name: 安装依赖软件包
        run: |
          sudo apt update
          sudo apt install -y \
            ccache \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ========== 设定 Android 版本与工具链 ==========
      - name: 设定 Android 版本及对应 Clang
        id: setup-version
        run: |
          # 手动触发时使用输入值，否则默认 sixteen-qpr2
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ANDROID_VER="${{ github.event.inputs.android_version }}"
          else
            ANDROID_VER="sixteen-qpr2"
          fi
          echo "ANDROID_VERSION=${ANDROID_VER}" >> $GITHUB_ENV

          # 统一使用 Clang r547379
          CLANG_VER="r547379"
          CLANG_TARBALL="clang-${CLANG_VER}.tar.gz"
          CLANG_URL="https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/${CLANG_TARBALL}"
          echo "CLANG_VERSION=${CLANG_VER}" >> $GITHUB_ENV
          echo "CLANG_TARBALL_URL=${CLANG_URL}" >> $GITHUB_ENV

      - name: 检出内核源码 (分支 ${{ env.ANDROID_VERSION }})
        uses: actions/checkout@v4
        with:
          repository: Geeeeeker/android_kernel_xiaomi_sm8250-pixelos
          ref: ${{ env.ANDROID_VERSION }}
          path: kernel

      # ========== 源码快速修复 ==========

      # ========== Clang 工具链缓存与下载 ==========
      - name: 缓存 Clang 工具链
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: 下载 Clang 工具链
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "${{ env.CLANG_TARBALL_URL }}" | tar xz -C clang

      - name: 缓存 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.ANDROID_VERSION }}-${{ github.run_id }}
          restore-keys: kernel-${{ env.DEVICE }}-${{ env.ANDROID_VERSION }}
          max-size: 5G

      # ========== 内核配置修改 (LXC/Docker) ==========
      - name: 配置 LXC 和 Docker 内核支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/${{ env.DEFCONFIG }}"

          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils

          if ! grep -q 'source "utils/Kconfig"' Kconfig; then
            echo 'source "utils/Kconfig"' >> Kconfig
          fi

          echo "CONFIG_DOCKER=y" >> "${DEFCONFIG}"
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "${DEFCONFIG}"
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "${DEFCONFIG}"

          if [ -f kernel/cgroup/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          elif [ -f kernel/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup.c
          else
            echo "Warning: cgroup.c not found, skipping runcpatch.sh"
          fi

          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch -p0 < utils/xt_qtaguid.patch
          fi

          sed -i '/CONFIG_LOCALVERSION/d' "${DEFCONFIG}"
          echo 'CONFIG_LOCALVERSION="-LXC-KSU-Next"' >> "${DEFCONFIG}"

      # ========== 合并设备专用配置 ==========
      - name: 合并基础内核配置片段
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export O=out

          mkdir -p out

          ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/stock-defconfig \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/umi.config

      # ========== 修复 Btrfs ZSTD 编译错误 ==========
      - name: 禁用 Btrfs ZSTD 支持（避免 ZSTD 版本不兼容）
        working-directory: kernel
        run: |
          # 确定最终配置不包含 BTRFS_FS_ZSTD
          scripts/config --file out/.config --disable BTRFS_FS_ZSTD
          # 更新依赖配置（自动处理相关选项）
          make O=out ARCH=arm64 olddefconfig

      # ========== 编译主内核 ==========
      - name: 编译内核
        working-directory: kernel
        run: |
          export SHELL=/bin/bash
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="${{ github.repository_owner }}"
          export KBUILD_BUILD_HOST="github-runner"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make -j$(nproc --all) \
            SHELL=/bin/bash \
            CC="ccache clang" \
            LD=ld.lld \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-unknown-warning-option -Wno-unused-but-set-variable" \
            Image.gz-dtb

      # ========== USB/IP 支持 ==========
      # ... （其余 USB/IP、打包 AnyKernel3、boot.img、APK 下载等步骤保持不变，此处省略以节省篇幅）
      # 如需完整文件，请参考之前回复中相同部分，仅修改了上述“禁用 Btrfs ZSTD”步骤。

  release:
    name: 发布
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # ... 发布步骤保持不变
